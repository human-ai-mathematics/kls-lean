name = "functional-inequalities"
version = "0.1.0"
defaultTargets = ["FunctionalInequalities", "Solutions", "Examples"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "3d425859e73fcfbef85b9638c2a91708ef4a22d4"

[[lean_lib]]
name = "FunctionalInequalities"

[[lean_lib]]
name = "Solutions"
srcDir = ".."
roots = [
  "solutions.LemLinearTestLower",
  "solutions.LemPoincareTensorization",
  "solutions.LemPoincareFiniteTensorization",
  "solutions.LemPoincareGaussianOneDimensional",
  "solutions.GaussianAxiomAudit",
  "solutions.FoundationAxiomAudit",
  "solutions.LemAmbientIntrinsicPoincareComparison",
  "solutions.LemLegacyRelaxedPoincareComparison",
  "solutions.StatementChecks",
  "solutions.LemCovarianceTestCoreDensity",
  "solutions.ThmSmoothLipschitzConstantEquivalence",
  "solutions.LemLogConcaveIntrinsicAbsoluteContinuity",
  "solutions.ThmSelectedLiteratureConstantEquivalence",
  "solutions.ThmCompactBorellLogconcavityEquivalence",
  "solutions.ThmBorellLogconcaveDensity",
  "solutions.LemAmbientIntrinsicCovariance",
  "solutions.LemCovarianceCoreClosure",
  "solutions.ThmAffineCovarianceRelaxationClosed",
  "solutions.LemAffinePoincareTranslationInvariance",
  "solutions.ThmAffineIsotropicReduction",
  "solutions.ThmSmoothGradientRelaxationDirichlet",
  "solutions.ThmOneDimensionalLogConcavePoincare",
  "solutions.ThmSmoothGradientRawCoreAgreementDensity",
  "solutions.LemConditionalFiberForm",
  "solutions.LemConditionalFiberEnergyComparison",
  "solutions.CorConditionalFiberTwelveBound",
  "solutions.CorAbsolutelyContinuousRelaxationTwoCheeger",
  "solutions.LemRelativePerimeterCheegerInfimum",
  "solutions.ThmSmoothGradientRelaxationTwoCheeger",
  "solutions.ThmRelaxedMinkowskiContentPerimeter",
  "solutions.ThmBakryEmeryPoincare",
  "solutions.ThmBklTaylorCriterion",
  "solutions.PropBklSuspension",
]

[[lean_lib]]
name = "Examples"
srcDir = ".."
roots = ["examples.PoincareFoundation", "examples.ApiOrganization"]

# `Dev/Search.lean` (LeanSearchClient query scratchpad) is intentionally NOT a `lean_lib`:
# the Blueprint's `lake exe checkdecls` imports the roots of every library of this package,
# and a library excluded from `defaultTargets` is never built in CI, so declaring it broke the
# Blueprint workflow (run 34136280179, "unknown module prefix 'Dev'"). Elaborate the scratchpad
# directly with `lake env lean Dev/Search.lean` or in an editor; it must never join `lake build`.
