name: Lean certification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formalization
          auto-config: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
          build: 'false'
      - name: Cache imported Mathlib modules
        working-directory: formalization
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          sources = [Path('FunctionalInequalities.lean')]
          sources += list(Path('FunctionalInequalities').rglob('*.lean'))
          sources += list(Path('../solutions').rglob('*.lean'))
          sources += list(Path('../examples').rglob('*.lean'))
          modules = set()
          for source in sources:
              for imports in re.findall(r'(?m)^(?:public )?import ([\w. ]+)', source.read_text()):
                  modules.update(name for name in imports.split() if name.startswith('Mathlib.'))
          if not modules:
              raise SystemExit('No Mathlib imports found; refusing an unbounded cache download')
          subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(modules)], check=True)
          PY
      - name: Verify source snapshot, task atlas, Lean declarations, and local kernel replay
        run: python3 research/verify.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kls-verification
          path: build/verification/
          if-no-files-found: warn
          retention-days: 14
