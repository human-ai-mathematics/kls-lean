  - id: https://github.com/HongruZhao/KLS500
    relationship: independent
    note: >-
      Parallel KLS formalization. Its stochastic-calculus import closure informed
      the vendored library selection; no KLS500 project source is included.
  - id: https://github.com/HongruZhao/KLS15
    relationship: independent
    note: Parallel KLS formalization; no priority is claimed here.
  - id: https://github.com/cgarryZA/LevyStochCalc/tree/984dbf0b790031eac05d56fe5a84b65e15e1e932
    relationship: adapts
    note: >-
      Vendored stochastic-calculus infrastructure (with BrownianMotion,
