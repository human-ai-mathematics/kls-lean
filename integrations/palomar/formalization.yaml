# Palomar entry metadata for the contained project integrations/palomar (comparator.json here).
# Source-level candidate prepared 2026-10-31; no Palomar preflight or submission has run.
version: v0.4

project:
  name: Dimension-free KLS Poincare bound for isotropic log-concave densities (smooth compactly supported tests)
  description: >-
    A Lean 4 / Mathlib library for Poincare inequalities, log-concave probability
    measures and stochastic localization. Its dimension-free KLS theorem bounds
    the intrinsic local-slope Poincare constant by one universal constant times
    the covariance operator norm, including dimension zero and singular affine
    supports, for log-concave probability laws with finite second moment. The
    proof follows Bizeul-Klartag-Lehec through finite-horizon cutoff localization,
    the compact Letwin constant-8 quadratic variance bound and approximation.
    Supporting results include Cheeger-Buser comparisons, covariance and energy
    interfaces and moment-map calculus. This entry checks the pinned OpenAI
    density formulation: for every n >= 1 and isotropic measurable log-concave
    probability density, Var(f) <= C * E|grad f|^2 for every smooth compactly
    supported real test, with one positive C before all dimensions and laws.
    No numerical final KLS constant, formal equivalence with the paper's locally
    Lipschitz L^2 test class, or uncut Eldan construction is claimed.
  authors: [Lazyfill]
  responsible_maintainers: [lyw-ops]
  license: Apache-2.0

classification:
  arxiv: [math.PR, math.FA, math.MG]
  msc2020: [60E15, 52A40, 46E35]

sources:
  - title: Presenting a proof of the Kannan-Lovasz-Simonovits conjecture
    authors: [Bizeul, Klartag, Lehec]
    id: https://arxiv.org/abs/2610.05474v1
    type: paper
    location: Theorem 1.1
    relationship: adapts
    author_endorsement: other
    note: >-
      Theorem 1.1 bounds the Poincare constant of isotropic log-concave laws by a
      universal constant for locally Lipschitz L^2 test functions. This entry
      states the bound for smooth compactly supported tests only, in the OpenAI
      density formulation, and claims no formal equivalence with the locally
      Lipschitz test class. The proof uses a locally constructed finite-horizon
      cutoff localization and a compact-to-general passage; it does not construct
      the paper's uncut Eldan process or its literal identities (68)-(73).
      Source-author involvement is not established in the current provenance
      records; no source-author endorsement is asserted.
  - title: The KLS constant is O(log^(1/4) n)
    authors: [Letwin]
    id: https://arxiv.org/abs/2607.24164v1
    type: paper
    location: Theorem 1.2 (compact case, exact constant 8)
    relationship: other
    author_endorsement: other
    note: >-
      Proof ingredient: the exact constant-8 quadratic variance bound for compactly
      supported isotropic log-concave laws is formalized in this repository and
      consumed by the Bizeul-Klartag-Lehec route (their Lemma 4.2). Letwin's own
      route to his Theorem 1.1 is not formalized and not used. Source-author
      involvement is not established in the current provenance records; no
      source-author endorsement is asserted.
  - title: Isoperimetric problems for convex bodies and a localization lemma
    authors: [Kannan, Lovasz, Simonovits]
    id: https://doi.org/10.1007/BF02574061
    type: paper
    location: Discrete and Computational Geometry 13 (1995), the KLS conjecture
    relationship: background
    note: >-
      Origin of the conjecture. The formal statement is the Poincare (spectral-gap)
      form for isotropic log-concave densities, not the original isoperimetric
      formulation for convex bodies.

