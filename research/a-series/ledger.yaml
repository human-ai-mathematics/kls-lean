      "source": "Blueprint 60-analytic-comparison-proofs.tex, lem:relative-perimeter-cheeger-infimum (Appendix A), together with the h_mu = h_nu^{sm,rel} and Psi_KLS(mu) = psi_nu clauses of thm:klartag-density-frontend-identification; local argument: h_M <= h_S by smooth recovery of a smooth domain (KLS.RelativePerimeter.exists_smooth_recovery_sequence) and the Minkowski coarea inequality of Ambrosio-Di Marino-Gigli 2017, Lemma 3.2 (Isoperimetry.lintegral_minkowskiContent_superlevel_le); h_S <= h_M by distance cutoffs of a Borel set of finite content, whose gradient integral is at most (nu(B^r) - nu(B))/r and whose L1 distance to the indicator is at most nu(B^r) - nu(B), their mollification (exists_smooth_approximation_lipschitz), smooth Sard (SmoothDomain.ae_exists_superlevel: almost every strict superlevel set is a smooth domain) and the weighted C1 coarea formula for the density (lintegral_enorm_gradient_mul_eq_lintegral_levelSet), giving h_S int_0^1 m(nu{u > t}) dt <= int |grad u| dnu for smooth Lipschitz [0,1]-valued u; the balance m is 1-Lipschitz in the set, the error is subtracted from the balance rather than multiplied into h_S so no finiteness of h_S is used, and the liminf along r -> 0+ recovers the Minkowski content.",
      "statement": "Let V be a finite-dimensional complete real inner product space with its Borel sigma algebra and second-countable norm topology, nu a Borel probability law on V, and rho a Borell density of nu relative to Lebesgue measure volume (KLS.IsBorellDensity nu volume rho: Borel, nonnegative, upper semicontinuous, log-concave, with volume.withDensity rho = nu). With m(t) = min {t, 1 - t}: Isoperimetry.minkowskiConstant nu = inf over Borel B with 0 < nu B < 1 of minkowskiContent nu B / m(nu B), where minkowskiContent nu B = liminf_{r -> 0+} (nu(B^r) - nu(B)) / r with open r-thickenings, and Isoperimetry.smoothConstant rho Omega nu = inf over smooth domains U (open sets locally on one side of their C-infinity boundary) with 0 < nu U < 1 of relativePerimeter rho Omega U / m(nu U), where relativePerimeter rho Omega U is the integral of rho over frontier U inter Omega against the normalized (n-1)-dimensional Hausdorff measure and Omega = interior nu.support; both infima are +infinity when no admissible set exists, in particular in dimension zero. The single certificate Solutions.LemRelativePerimeterCheegerInfimum.certificate states minkowskiConstant nu = smoothConstant rho (interior nu.support) nu, for every such nu and rho. Solutions.LemRelativePerimeterCheegerInfimum.intrinsic states, for a compact-set log-concave law mu on E and a Borell density rho of its intrinsic law on the direction space of its affine support relative to Lebesgue measure there, that the affine-support isoperimetric constant Isoperimetry.constant mu of def:isoperimetric-cheeger-scale equals smoothConstant rho (interior (intrinsicMeasure mu).support) (intrinsicMeasure mu) and that Isoperimetry.inverseScale mu is its inverse; Dirac laws are included with both sides +infinity resp. 0. Lean is stronger than the Blueprint's full-dimensional log-concave hypothesis: any law with a Borell density is allowed. Not claimed: any relation between the Minkowski content and the relative perimeter of an individual set, the BV-perimeter identification of thm:logconcave-cheeger-poincare-comparison, the Poincare-constant clause of thm:klartag-density-frontend-identification, any Cheeger-Buser comparison, and any Poincare inequality.",
