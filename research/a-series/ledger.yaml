      "statement": "Fix a universe u and a finite K : NNReal. KLS.IsotropicBound K states that every compact-set log-concave Borel probability law nu on every finite-dimensional complete real inner product space V : Type u (Borel, second countable) that is isotropic (KLS.Isotropic: finite second moment, zero mean, identity covariance operator) satisfies Poincare.LocalSlope.Intrinsic.constant nu <= K. KLS.CovarianceBound K states that every compact-set log-concave law mu on every such space E satisfies Poincare.LocalSlope.Intrinsic.constant mu <= K * ENNReal.ofReal ||Covariance.operator mu||. KLS.AffineBound K states that every compact-set log-concave law mu on every such space satisfies Poincare.CovarianceGradient.Intrinsic.constant mu <= K. The single certificate Solutions.ThmAffineIsotropicReduction.certificate packages, for every K: IsotropicBound K <-> CovarianceBound K, CovarianceBound K <-> AffineBound K, IsotropicBound K <-> AffineBound K, and AffineBound K in universe zero implies the literal proposition KLS.Conjecture on the Euclidean family EuclideanSpace R (Fin n). The zero-dimensional law is included in every statement. The converse passage from the Fin n family to arbitrary spaces, the truth of any of the three statements for some K, any Poincare inequality and KLS itself are not claimed.",
