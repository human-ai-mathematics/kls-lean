    {
      "id": "lem:poincare-tensorization",
      "kind": "lemma",
      "status": "proved",
      "source": "Bakry-Gentil-Ledoux (2014), Proposition 4.3.1, two-factor upper bound; smooth-test Hilbert realization and domain correspondence are explicit in the Lean certificate; normalization from KLS.pdf, Definition 2.1",
      "statement": "Let E and F be real separable Hilbert spaces (complete real inner product spaces with second-countable norm topologies), each equipped with its Borel sigma algebra. For measures mu on E and nu on F, define rho = (mu.prod nu).map (WithLp.toLp 2), a measure on the Hilbert product WithLp 2 (E x F). For all real C and C', Poincare.SmoothTest.Holds mu C and Poincare.SmoothTest.Holds nu C' imply Poincare.SmoothTest.Holds rho (max C C'). Holds includes probability normalization, nonnegativity of its constant, and Var(f) <= C integral ||gradient f||^2 for every globally smooth real-valued L2 test with integrable squared canonical gradient. Moreover, for every pair of Borel probability measures mu and nu, Poincare.SmoothTest.constant rho <= max (Poincare.SmoothTest.constant mu) (Poincare.SmoothTest.constant nu) in ENNReal, including infinite optimal constants. No second-moment, density, positive-dimension, or finite-optimal-constant assumption is imposed.",
      "lean_solution": "solutions/LemPoincareTensorization.lean",
      "checked_by": "lean"
    },
    {
      "id": "lem:poincare-finite-tensorization",
      "kind": "lemma",
      "status": "proved",
      "source": "GitHub Issue #7 (sub-issue of #1), https://github.com/human-ai-mathematics/kls-lean/issues/7; BGL (2014), Proposition 4.3.1 for the binary upper bound and its finite iteration; coordinate lifting independently supplies reverse bounds and equality; upstream prop:products at 8185e46ffb040e04fea076953e5bcaeb4157d71a",
      "statement": "All constants below refer to the unchanged Poincare.SmoothTest.Admissible class of globally smooth real-valued L2 tests with integrable squared canonical Hilbert gradient, with normalization Var_mu(f) <= C integral ||gradient f||^2 dmu. Holds includes probability and nonnegativity of its finite real constant; constant is the ENNReal infimum over finite NNReal constants satisfying Holds. Binary case: let E and F be complete real inner product spaces with second-countable norm topologies and Borel measurable structures, and assume separately that mu on E and nu on F are probability measures. Put rho = prodMeasure mu nu = (mu.prod nu).map (WithLp.toLp 2) on WithLp 2 (E x F). For every real C, Holds rho C implies both Holds mu C and Holds nu C. Each of constant mu and constant nu is at most constant rho, and constant rho = max (constant mu) (constant nu). Probability of rho alone is not the factor normalization hypothesis. Finite case: let iota be any type with a Fintype instance, and let E : iota -> Type be a dependent family of complete real inner product spaces, each with Borel measurable structure and second-countable norm topology. Let mu i be a probability measure on E i for every i. Define piMeasure mu = (Measure.pi mu).map (WithLp.toLp 2) on PiLp 2 E, whose squared Hilbert norm is the finite sum of squared factor norms; the ordinary function-space maximum norm is not used as the Hilbert norm. For every C : iota -> NNReal, if Holds (mu i) (C i : Real) for all i, then Holds (piMeasure mu) ((Finset.univ.sup C : NNReal) : Real). For every real c and i : iota, Holds (piMeasure mu) c implies Holds (mu i) c. For each i, constant (mu i) <= constant (piMeasure mu); moreover constant (piMeasure mu) <= iSup_i constant (mu i), and hence constant (piMeasure mu) = iSup_i constant (mu i), all in ENNReal. No nonempty-index hypothesis is imposed: the empty finite supremum in NNReal and empty indexed supremum in ENNReal are zero, and the empty product satisfies Holds at zero and has optimal constant zero. A Unique index recovers constant (mu default). A probability measure on a subsingleton Hilbert space has fixed and optimal constant zero; arbitrary zero-dimensional factors are allowed, and a family consisting entirely of such factors has optimal constant zero. Any factor constant equal to infinity forces the product constant to equal infinity. Euclidean specializations use E i = EuclideanSpace Real (Fin (d i)) for arbitrary natural-number dimensions d i, with empty, singleton, mixed zero-dimensional and all-zero-dimensional families included. The supporting transport interfaces assert, under the same ambient assumptions, exact admissibility, variance and energy correspondence and invariance of Holds and constant under a real linear isometry equivalence and pushforward of a probability law. For a continuous real linear projection q between these Hilbert spaces, with isometric adjoint and a measure-preserving map between the two probability laws, admissible factor tests lift by composition with q with unchanged variance and energy; L2 and real-energy identities retain their MemLp or Admissible hypotheses. Dependent reindexing and Option splitting preserve the specified product laws and Hilbert norms. No second-moment, density, positive-dimension, finite-optimal-constant or infimum-attainment assumption is imposed. Infinite constants are handled only in ENNReal, never converted to real fixed constants. No equivalence with a Sobolev, closed Dirichlet or spectral-gap test domain and no Gaussian, LSI, Bakry-Emery, Cheeger comparison or full KLS result is claimed.",
      "lean_solution": "solutions/LemPoincareFiniteTensorization.lean",
      "checked_by": "lean"
    },
    {
      "id": "lem:poincare-gaussian-one-dimensional",
      "kind": "lemma",
      "status": "proved",
      "source": "Gaussian covariance family fam:gaussian-covariance, modules/03-tier1-gaussian.tex lines 10-37, at kls-exploration commit cd4a894a0faf40c0180f80b1a31eec1fdb6cb576; Poincare normalization from Definition 2.1 and sharpness from Remark 3.8. Arbitrary means, the zero-variance Dirac case, the smooth finite-energy test domain, and the direct density proof route are explicit local specifications.",
      "statement": "For every real mean m and every nonnegative variance v : NNReal, let gamma = ProbabilityTheory.gaussianReal m v, a probability measure on the real line. For the unchanged Poincare.SmoothTest.Admissible class of globally smooth real-valued functions f with MemLp f 2 gamma and integrable squared canonical gradient, Poincare.SmoothTest.Holds gamma (v : Real): for every such f, Var_gamma(f) <= (v : Real) * integral ||gradient f||^2 dgamma. On the real line the canonical gradient equals the ordinary derivative. Moreover Poincare.SmoothTest.constant gamma = (v : ENNReal), where constant is the existing ENNReal infimum over finite NNReal constants satisfying Holds. The parameter v is the variance, not the standard deviation; the energy has no extra factor. No restriction on m or positivity premise on v occurs in either conclusion. At v = 0, gamma is Measure.dirac m and the fixed and optimal constants are zero. The identity test is admissible, has variance v and energy one, and supplies the matching lower bound for every finite valid constant. Positive-variance density helpers are used only under v != 0. No boundedness, compact support, additional derivative-integrability, test-function decay, or infimum-attainment assumption is imposed. This claim concerns the current smooth L2 finite-energy domain; it does not identify a closed Sobolev or spectral-gap domain or assert a multivariate, log-Sobolev, or transport-entropy theorem.",
      "lean_solution": "solutions/LemPoincareGaussianOneDimensional.lean",
      "checked_by": "lean"
    },
    {
      "id": "lem:ambient-intrinsic-poincare-comparison",
      "kind": "lemma",
      "status": "proved",
      "source": "Local Blueprint thm:ambient-intrinsic-relaxation-equality and cor:ambient-intrinsic-constant-equality in formalization/blueprint/src/chapters/30-open-canonical-bridges.tex; local restriction and orthogonal-projection extension argument.",
      "statement": "Let E be any finite-dimensional complete real inner product space with Borel measurable structure and second-countable norm topology, and let mu be any ProbabilityMeasure E. An ambient Energy.SmoothGradient.Test restricts along Probability.reconstruct mu to an intrinsic Energy.SmoothGradient.Test whose L2 realization is toIntrinsicL2 mu of the original class and whose finite raw gradient energy is at most the original energy. Conversely, every intrinsic Energy.SmoothGradient.Test has a globally smooth ambient extension restricting to that test, with the corresponding intrinsic L2 realization and exactly the same raw gradient energy. Consequently Energy.SmoothGradient.relaxation mu and Energy.SmoothGradient.Intrinsic.energy mu are equal as extended-energy functionals on the common original real L2(mu) space. For every C : NNReal their finite-domain Holds predicates are equivalent, and their optimal constants are equal in ENNReal. All conclusions include singular laws, proper affine supports, zero-dimensional spaces, and infinite energy or optimal-constant values. No density, second moment, log-concavity, positive dimension, raw/core agreement, Markov property, or Cheeger identification is assumed. The extension is to be constructed through orthogonal projection, not through the existing merely measurable off-support intrinsicMap.",
      "lean_solution": "solutions/LemAmbientIntrinsicPoincareComparison.lean",
      "checked_by": "lean"
    },
    {
      "id": "lem:legacy-relaxed-poincare-comparison",
      "kind": "lemma",
      "status": "proved",
      "source": "Local Blueprint thm:legacy-relaxed-holds-equivalence and thm:legacy-canonical-constant-comparison in formalization/blueprint/src/chapters/45-shared-analytic-bridges.tex. Historical manuscript Definition 2.1 supplies only the variance/gradient normalization via Poincare.SmoothTest.Basic. The abstract pre-energy extension and exact frontend comparison are local specifications.",
      "statement": "For every probability measure mu on an arbitrary measurable space and every finite PreEnergy P realized in real L2(mu), let TestFamily.ofPreEnergy mu P have concrete tests P.Test, variance L2.variance mu of P.toAmbient, and raw energy P.energy. For every C : NNReal, its Holds predicate is equivalent to Poincare.L2Energy.Holds mu P.sequentialRelaxation C on the finite relaxed-energy domain; its extended optimal constant equals Poincare.L2Energy.constant mu P.sequentialRelaxation. This requires neither dense realization nor quadraticity nor raw/relaxed agreement and includes empty test types, C = 0 and infinite optimal constants. In a finite-dimensional complete real inner product space with Borel measurable structure and second-countable norm topology, for every ProbabilityMeasure mu, legacy Holds (mu : Measure E) (C : Real) is equivalent to the raw Energy.SmoothGradient.preEnergy test-family inequality, then to Poincare.SmoothGradient.Ambient.Holds mu C. The legacy ENNReal infimum equals Poincare.SmoothGradient.Ambient.constant mu. Combining this with lem:ambient-intrinsic-poincare-comparison yields equivalence with Poincare.SmoothGradient.Intrinsic.Holds mu C and equality with Poincare.SmoothGradient.Intrinsic.constant mu. Both smooth test presentations use ordinary C-infinity, square-integrability and integrability of squared canonical gradient, with normalization variance <= C integral norm(gradient)^2 and no extra factor. No density, second moment, log-concavity, positive dimension, finite optimum or attainment is assumed. The locally Lipschitz literature constant and KLS itself are outside these seven comparison theorems.",
      "lean_solution": "solutions/LemLegacyRelaxedPoincareComparison.lean",
      "checked_by": "lean"
    },
    {
      "id": "lem:covariance-test-core-density",
      "kind": "lemma",
      "status": "proved",
      "checked_by": "lean",
      "source": "Local Blueprint Appendix A, formalization/blueprint/src/chapters/60-analytic-comparison-proofs.tex, lem:covariance-test-core-density. Cutoff and compact-support mollification interfaces split the written proof; interval-preserving L1 smoothing is its bounded variant.",
      "statement": "Let E be a finite-dimensional complete real inner product space with Borel measurable structure and second-countable topology, nu a probability measure on E, and m an additive Haar (Lebesgue reference) measure with nu absolutely continuous with respect to m. For every continuous linear endomorphism B and locally Lipschitz real-valued g with g and B(gradient g) in L2(nu), there exists a sequence of globally C-infinity compactly supported functions g_j such that each g_j and B(gradient g_j) belongs to L2(nu), and the eLpNorm at exponent 2 of both differences g_j-g and B(gradient g_j)-B(gradient g) tends to zero. Separate proved intermediate statements provide compactly supported globally Lipschitz weighted approximation and full-gradient L2 mollification of a compactly supported Lipschitz function preserving its Lipschitz constant. A bounded L1 variant preserves any supplied interval [a,b] and global Lipschitz constant, with source/approximant value and gradient membership in L1(nu), and convergence in both L1 differences; compact support is not required for that variant. The Haar normalization is arbitrary. Zero dimension, zero B and singular B are included. No log-concavity, positive density bound, second moment, full-gradient L2 assumption on the original locally Lipschitz g, or comparison of translated density values is imposed. All four declarations are proved and packaged by Solutions.LemCovarianceTestCoreDensity.certificate. This does not establish local-slope/gradient identification, a Poincare constant comparison or KLS.",
      "lean_solution": "solutions/LemCovarianceTestCoreDensity.lean"
    },
    {
      "id": "thm:smooth-lipschitz-constant-equivalence",
      "kind": "lemma",
      "status": "proved",
      "checked_by": "lean",
      "source": "Local Blueprint thm:smooth-lipschitz-constant-equivalence in formalization/blueprint/src/chapters/45-shared-analytic-bridges.tex. Pointwise slope and gradient correspondence makes the proof's energy identification explicit. The final selected-constant corollary is conditional on intrinsic absolute continuity, not the unrestricted log-concave theorem.",
      "statement": "Eight proved theorem declarations. In a complete real inner product space, at every point where a real-valued function is Frechet differentiable, the existing Energy.LocalSlope.apply equals ENNReal.ofReal of the canonical gradient norm, including the zero space. On a finite-dimensional Borel second-countable such space, let nu be a probability law absolutely continuous with respect to an additive Haar reference measure m. For every locally Lipschitz f the equality holds nu-almost everywhere, and Energy.LocalSlope.energy nu f equals the lintegral of the squared extended gradient norm, including infinite energy. Energy.LocalSlope.Admissible nu f is equivalent to locally Lipschitz f, MemLp f 2 nu, and MemLp (gradient f) 2 nu. For every C : NNReal, legacy Poincare.SmoothTest.Holds nu (C : Real) is equivalent to Poincare.LocalSlope.Holds nu C; their infima over finite nonnegative constants on the same coordinate measure are equal in ENNReal. For an arbitrary ambient probability mu, assuming only intrinsicMeasure mu is absolutely continuous with respect to a Haar measure on (affineSupport mu).direction, the legacy constant of mu equals that of intrinsicMeasure mu, and the latter equals Poincare.LocalSlope.Intrinsic.constant mu. The selected intrinsic-affine smooth-gradient relaxation constant consequently equals Poincare.LocalSlope.Intrinsic.constant mu under this same explicit hypothesis. Ambient singularity, zero-dimensional support, zero finite constants and infinite optimal constants are included. No positive density bound, log-concavity, second moment, infimum attainment, Cheeger identification or raw/core agreement is assumed. This does not prove intrinsic absolute continuity for log-concave laws or KLS. The a.e. slope and extended-energy declarations omit the redundant second-countable instance; all original mathematical conclusions remain covered.",
      "lean_solution": "solutions/ThmSmoothLipschitzConstantEquivalence.lean"
    },
    {
      "id": "lem:logconcave-intrinsic-absolute-continuity",
      "kind": "lemma",
      "status": "proved",
      "checked_by": "lean",
      "source": "Absolute-continuity portion of Borell (1974), Convex measures on locally convex spaces, Theorem 1.1; direct compact-set proof by local ball averages, separation, Tonelli and Besicovitch covering.",
      "statement": "Let E be a finite-dimensional complete real inner product space with its Borel sigma algebra and second-countable norm topology. For every probability measure mu on E satisfying the existing KLS.LogConcave compact-set inequality, and every additive Haar reference measure m on the direction of Probability.affineSupport mu, Probability.intrinsicMeasure mu is absolutely continuous with respect to m. Ambient singularity and zero-dimensional affine support are included. No density, full-dimensional ambient support, second moment, or positive-dimensional hypothesis is assumed. This certifies only the absolute-continuity part of the broader Borell representation node, not its density representative, local positivity or moment conclusions.",
      "lean_solution": "solutions/LemLogConcaveIntrinsicAbsoluteContinuity.lean"
    },
    {
      "id": "thm:selected-literature-constant-equivalence",
      "kind": "lemma",
      "status": "proved",
      "checked_by": "lean",
      "source": "Blueprint thm:selected-literature-constant-equivalence; composition of the proved intrinsic absolute-continuity, smooth/literature and legacy/relaxed comparisons.",
      "statement": "For every probability law mu on a finite-dimensional complete real inner product space with its Borel sigma algebra and second-countable norm topology, KLS.LogConcave mu implies Poincare.SmoothGradient.Intrinsic.constant mu = Poincare.LocalSlope.Intrinsic.constant mu in ENNReal. Absolute continuity of the intrinsic law is proved from compact-set log-concavity, not added as a hypothesis. Singular ambient laws, zero-dimensional affine support, zero and infinite optimal constants are included. No Cheeger-energy identification, raw/core agreement, finite-moment hypothesis or KLS bound is asserted.",
      "lean_solution": "solutions/ThmSelectedLiteratureConstantEquivalence.lean"
    },
    {
      "id": "thm:compact-borell-logconcavity-equivalence",
      "kind": "lemma",
      "status": "proved",
      "checked_by": "lean",
      "source": "Blueprint 00-orientation-and-status.tex, thm:compact-borell-logconcavity-equivalence; Bobkov (1999), equation (5.1), explicitly uses inner measure. Compact inner regularity supplies the local equivalence argument.",
      "statement": "Let E be a finite-dimensional real normed vector space equipped with its Borel sigma algebra, including dimension zero, and let mu be any Borel probability measure. For every arbitrary set S define innerMeasure(mu,S) as the supremum of mu(K) over all compact K contained in S, including the empty compact set. The existing KLS.LogConcave compact-set predicate holds if and only if, for all Borel sets B0,B1 and every real 0 < t < 1, mu(B0)^t * mu(B1)^(1-t) <= innerMeasure(mu,{z | exists x in B0, exists y in B1, z = t*x + (1-t)*y}). All quantities and powers are in ENNReal. The Minkowski combination is not evaluated by the outer-measure extension of mu. Singular laws, null sets, proper affine supports and zero-dimensional spaces are included. No absolute-continuity, full-support, density or second-moment premise is imposed. The definitions and the equivalence are Lean-proved and packaged by Solutions.ThmCompactBorellLogconcavityEquivalence.certificate, whose proof uses compact inner regularity, compactness of the Minkowski combination of compact sets, and the commutation of positive ENNReal powers and products with suprema. No Borell density representative, local density bounds, moments, Dirichlet property, Cheeger-energy identification or KLS theorem is claimed.",
      "lean_solution": "solutions/ThmCompactBorellLogconcavityEquivalence.lean"
    },
    {
      "id": "thm:borell-logconcave-density",
      "kind": "lemma",
      "status": "proved",
      "checked_by": "lean",
      "source": "Blueprint 00-orientation-and-status.tex, thm:borell-logconcave-density; Borell (1974), Convex measures on locally convex spaces, Ark. Mat. 12, 239-252, Theorem 1.1 and its finite-dimensional consequences; Bobkov (1999) for the exponential tail. Intrinsic absolute continuity is the proved node lem:logconcave-intrinsic-absolute-continuity.",
      "statement": "Let E be a finite-dimensional complete real inner product space with its Borel sigma algebra and second-countable norm topology, mu a probability measure on E satisfying the existing compact-set KLS.LogConcave inequality, V the direction of Probability.affineSupport mu, nu = Probability.intrinsicMeasure mu on V, and m any additive Haar measure on V. KLS.IsBorellDensity nu m rho means: rho : V -> Real is Borel measurable, nonnegative, upper semicontinuous, log-concave in the pointwise real-power sense rho(x)^t * rho(y)^(1-t) <= rho(t x + (1-t) y) for 0 < t < 1, and m.withDensity (ENNReal.ofReal . rho) = nu. The single certificate Solutions.ThmBorellLogconcaveDensity.certificate packages, for every such mu and m: (1) some rho with KLS.IsBorellDensity nu m rho exists, with (2) positivity at every point of Omega = interior nu.support and (3) bounds on every compact K subset of Omega: there are real a, b with 0 < a and a <= rho x <= b for all x in K. Properties (2) and (3) refer to the same existential witness rho; (4) the closure of the convex hull of nu.support equals nu.support, so Omega is the interior of the closed convex hull of the topological support as in the Blueprint; (5) nu(V minus Omega) = 0; (6) some t > 0 makes exp(t * norm v) nu-integrable; (7) for every natural p, norm v ^ p is nu-integrable. Singular ambient laws and zero-dimensional affine supports are included; in dimension zero every Haar measure is a positive multiple of the Dirac mass. No second moment, density, positive dimension or full-dimensional ambient support is assumed. The representative is constructed as the upper semicontinuous envelope of the liminf of equal-radius ball ratios, identified with the Radon-Nikodym derivative by Besicovitch differentiation; the exponential moment is Borell's lemma through the proved Borel-set formulation. The separate library theorems KLS.IsBorellDensity.pos_of_mem_interior_support, continuousOn_interior_support and exists_bounds_of_isCompact give positivity, continuity and compact bounds for every supplied Borell density representative; that universal statement is not a conjunct of certificate. No Poincare, Cheeger, Dirichlet or KLS conclusion is claimed.",
      "lean_solution": "solutions/ThmBorellLogconcaveDensity.lean"
    },
    {
      "id": "lem:ambient-intrinsic-covariance",
      "kind": "lemma",
      "status": "proved",
      "checked_by": "lean",
      "source": "Blueprint 45-shared-analytic-bridges.tex, lem:ambient-intrinsic-covariance; local argument: barycenter in the affine support, transport of Mathlib's covarianceBilin along translation and orthogonal projection, and minimality of the affine support for positive definiteness.",
      "statement": "Let E be a finite-dimensional complete real inner product space with its Borel sigma algebra and second-countable norm topology, mu a Borel probability measure on E with MemLp id 2 mu, V the direction of Probability.affineSupport mu and nu = Probability.intrinsicMeasure mu on V. Covariance.operator is Mathlib's centered covarianceBilin represented as an operator. The single certificate Solutions.LemAmbientIntrinsicCovariance.certificate packages: (1) Covariance.operator mu w = 0 for every w in the orthogonal complement of V; (2) for every v in V, Covariance.operator mu v equals the ambient image of Covariance.operator nu v, so the ambient operator restricts to the intrinsic covariance on V; (3) the operator norms of Covariance.operator nu and Covariance.operator mu are equal; (4) for every nonzero v in V, the inner product of Covariance.operator nu v with v is strictly positive; (5) if V is the zero submodule then both operators are zero. The proof also records that the barycenter lies in the affine support and that the intrinsic law keeps a finite second moment. Singular ambient laws and zero-dimensional affine supports are included. No log-concavity, density, whitening, Poincare or KLS statement is claimed.",
      "lean_solution": "solutions/LemAmbientIntrinsicCovariance.lean"
    },
    {
      "id": "lem:covariance-core-closure",
      "kind": "lemma",
      "status": "proved",
      "checked_by": "lean",
      "source": "Blueprint 60-analytic-comparison-proofs.tex, lem:covariance-core-closure; local argument: Hilbert selection by minimal-norm elements of tail convex hulls for the relaxation/closure identification, integration by parts for Lipschitz functions by mollification and translation invariance, the fundamental lemma of the calculus of variations on the support interior, Mathlib density of smooth compactly supported functions, and the certified weighted approximation lemma for the smooth core.",
      "statement": "Let V be a finite-dimensional complete real inner product space with its Borel sigma algebra and second-countable norm topology, nu a compact-set log-concave Borel probability law on V whose support has nonempty interior, m any additive Haar measure on V and B any continuous linear endomorphism of V (the Blueprint's Sigma^(1/2); Sigma = B^* B is positive semidefinite). Let T = KLS.LogConcave.weightedOperator be the partially defined operator on L^2(nu) with values in L^2(nu; V) whose graph consists of the pairs ([g], [B grad g]) for globally Lipschitz g in L^2(nu) with B grad g in L^2(nu; V), grad the canonical Hilbert gradient. The single certificate Solutions.LemCovarianceCoreClosure.certificate packages: (1) the domain of T is dense in L^2(nu); (2) T is closable; (3) for every submodule S between the smooth compactly supported classes Energy.WeightedGradient.smoothCore nu and the domain of T, the closure of the restriction of T to S equals the closure of T, so in particular the restrictions of R + C_c^infinity(V) have the same graph closure; (4) the sequential relaxation of the pre-energy f -> ||T f||^2 equals ||closure(T) f||^2 on the domain of the closure; (5) it equals top outside that domain. Typed applications cover the intrinsic law of every log-concave law on EuclideanSpace R (Fin n), the zero-dimensional direction space where the operator vanishes on the whole L^2 space, and the identity between Energy.CovarianceGradient.Intrinsic.energy and the operator relaxation for every B with <Sigma v, v> = ||B v||^2. No Poincare inequality, translation invariance, isotropic reduction or KLS statement is claimed.",
      "lean_solution": "solutions/LemCovarianceCoreClosure.lean"
    },
    {
      "id": "thm:affine-covariance-relaxation-closed",
      "kind": "lemma",
      "status": "proved",
      "checked_by": "lean",
      "source": "Blueprint 45-shared-analytic-bridges.tex, thm:affine-covariance-relaxation-closed; local argument: a square root B of the intrinsic covariance from the spectral theorem, the certified closable weighted gradient operator of lem:covariance-core-closure, the generic quadratic-relaxation closure theorem, and pullback of L^2 classes along translations of the intrinsic law.",
      "statement": "Let E be a finite-dimensional complete real inner product space with its Borel sigma algebra and second-countable norm topology, mu a compact-set log-concave Borel probability law on E, V the direction of Probability.affineSupport mu, nu = Probability.intrinsicMeasure mu and Sigma = Covariance.operator nu. The single certificate Solutions.ThmAffineCovarianceRelaxationClosed.certificate packages: (1) the covariance pre-energy Energy.CovarianceGradient.preEnergy nu of def:affine-poincare-constant has dense realization in L^2(nu); (2) Energy.CovarianceGradient.Intrinsic.energy mu is a densely defined closed quadratic form (Energy.ClosedQuadratic); (3) the globally Lipschitz tests form a sequential core: the relaxation returns the raw covariance energy on every test and is generated by them; (4) for every c in V, translating nu by c leaves Covariance.operator unchanged, the pullback L2.Translation.pullbackEquiv along the translation is an L^2 isometric equivalence preserving L2.variance, the covariance relaxation of the translated law is the affine relaxation pulled back along it, and Poincare.CovarianceGradient.Intrinsic.constant mu equals the optimal L^2 constant of the translated covariance relaxation; (5) there is B : V ->L[R] V with <Sigma v, v> = ||B v||^2 for all v such that the intrinsic weighted gradient operator B grad is closable, Energy.CovarianceGradient.Intrinsic.energy mu equals Energy.PreEnergy.normSqEnergy of the closure of B grad restricted to the core Energy.WeightedGradient.constantSmoothCore nu (the classes of R + C_c^infinity(V)), and Poincare.CovarianceGradient.Intrinsic.constant mu is the optimal L^2 constant of that closed form. Dimension zero is included. No Poincare inequality, translation invariance of the affine constant under ambient translations of mu, isotropic reduction or KLS statement is claimed.",
      "lean_solution": "solutions/ThmAffineCovarianceRelaxationClosed.lean"
    },
    {
      "id": "lem:affine-poincare-translation-invariance",
      "kind": "lemma",
      "status": "proved",
