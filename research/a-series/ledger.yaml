      "source": "Blueprint 30-open-canonical-bridges.tex, thm:smooth-gradient-relaxation-two-cheeger (the unconditional Cheeger identification, of which cor:absolutely-continuous-relaxation-two-cheeger is the absolutely continuous special case); local argument: a globally smooth test is an admissible local-slope test with the same energy, giving LocalSlope.relaxation <= SmoothGradient.relaxation unconditionally; for the reverse inequality the local slope of a continuous function is Borel (countable infimum of lower-semicontinuous secant suprema), a globally Lipschitz test is patched by McShane extensions on finitely many compact cores of a slope-adapted Borel partition (inner regularity) into a globally Lipschitz test whose asymptotic Lipschitz constant is within 2 alpha of the local slope off a set of mass delta, mollification recovers each patch by smooth tests (reverse Fatou with the global Lipschitz bound), a cutoff with Young's inequality reduces admissible tests to globally Lipschitz ones, and lower semicontinuity of the relaxation finishes; collapsing the sandwich with the asymptotic-Lipschitz relaxation gives the agreement of the two Cheeger conventions. Closest literature: S. Eriksson-Bique, Density of Lipschitz functions in energy, Calc. Var. PDE 62 (2023), Article 60, Theorem 1.1 (general metric measure spaces), of which this Euclidean argument is an elementary special case; Ambrosio-Gigli-Savare, Rev. Mat. Iberoam. 29 (2013) Sec. 8.3 (same conclusion via Hopf-Lax).",
      "statement": "Let E be a finite-dimensional complete real inner product space with its Borel sigma algebra and second-countable norm topology and mu ANY Borel probability law on E; no absolute continuity, no density, no positive dimension and no log-concavity is assumed. Energy.LocalSlope.relaxation nu is the sequential lower-semicontinuous L2(nu) relaxation of the squared local-slope energy over the literature test class Energy.LocalSlope.Admissible, and Energy.Cheeger.energy nu is one half of it (the Blueprint's local-slope convention, fixed by the definition Energy.Cheeger.energy := Cheeger.ofLocalSlope). The single certificate Solutions.ThmSmoothGradientRelaxationTwoCheeger.certificate packages: (1) Energy.SmoothGradient.relaxation (intrinsicMeasure mu) = Energy.LocalSlope.relaxation (intrinsicMeasure mu); (2) for every f in L2(mu), Energy.SmoothGradient.Intrinsic.energy mu f = 2 * Energy.Cheeger.Intrinsic.energy mu f, that is the Blueprint's E^can_mu = 2 Ch_mu on ambient L2(mu) with the value infinity allowed on both sides. Solutions.ThmSmoothGradientRelaxationTwoCheeger.conventions_agree states, on the coordinate space for every Borel probability law nu, LocalSlope.relaxation nu = AsymptoticLipschitz.relaxation nu and Cheeger.energy nu = Cheeger.ofAsymptoticLipschitz nu. Dirac laws, laws carried by proper affine subspaces and a one-point affine support (both sides zero) are included. No Poincare inequality, no finiteness of any constant, no Cheeger-Buser comparison, no agreement of raw slope energy with the relaxed energy on an individual test, and no relation to the isoperimetric number of def:isoperimetric-cheeger-scale is claimed.",
