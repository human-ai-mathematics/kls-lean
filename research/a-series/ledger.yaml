      "source": "Ambrosio-Di Marino-Gigli, Perimeter as relaxed Minkowski content in metric measure spaces, arXiv:1603.08412v1, Theorem 3.6 with Definition 3.3 (paper-target certificate for ADMG2017 in research/progress/literature.json); Blueprint 45-shared-analytic-bridges.tex, thm:relaxed-minkowski-content-perimeter. Local argument: MetricBV.relaxedMinkowskiContent_eq_perimeter_of_finite_on_bounded (relaxed lower content equals the bounded-support metric BV perimeter at measurable finite-mass targets under a measure finite on bounded Borel sets) composed with MetricBV.lipschitzRelaxation_eq_perimeter_of_measure_lt_top (the Definition 3.3 relaxation equals the same perimeter at measurable finite-mass targets under any Borel measure); both were proved in the 6ca1824 snapshot, whose remote Lean certification passed. The composed statement was previously checked by the audit client research/audits/MetricBVDefinitionClassAudit.lean.",
