      "source": "Blueprint 45-shared-analytic-bridges.tex, lem:affine-poincare-translation-invariance; local argument: compact-set log-concavity is transported by the inverse translation (an affine isometry), the affine support of the translated law is the translated affine support with the same direction, the intrinsic law of the translated law is a translate inside the direction space of the isometric image of the intrinsic law, and the covariance relaxation and its optimal constant are transported along linear isometric equivalences and translations. Statement design, semantic alignment and proofs: research/decisions/2026-09-08-affine-poincare-translation-invariance.md.",
      "statement": "Let E be a finite-dimensional complete real inner product space with its Borel sigma algebra and second-countable norm topology, mu a compact-set log-concave Borel probability law on E, and for b in E let tau_b(x) = b + x and (tau_b)_# mu = Probability.translateLaw mu b. The single certificate Solutions.LemAffinePoincareTranslationInvariance.certificate packages, for every b: (1) Probability.translateLaw mu b is compact-set log-concave; (2) its ambient covariance operator Covariance.operator equals that of mu; (3) the direction of Probability.affineSupport (translateLaw mu b) equals the direction of Probability.affineSupport mu; (4) there is a linear isometric equivalence between the intrinsic L^2 spaces of the translated law and of mu preserving L2.variance and intertwining the affine covariance relaxations Energy.CovarianceGradient.Intrinsic.energy; (5) Poincare.CovarianceGradient.Intrinsic.constant (translateLaw mu b) = Poincare.CovarianceGradient.Intrinsic.constant mu. In addition mu has a finite ambient second moment (MemLp id 2 mu), so its barycenter exists, and translating by the negative barycenter gives a law with zero mean. Dimension zero is included. The constant identity (5), the covariance identity (2), the direction identity (3) and the isometry (4) hold for every Borel probability law; log-concavity is used only for (1) and the barycenter. No Poincare inequality, finiteness of the constant, isotropic reduction or KLS statement is claimed.",
