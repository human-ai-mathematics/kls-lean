    {
      "id": "lem:poincare-tensorization",
      "kind": "lemma",
      "status": "proved",
      "source": "Bakry-Gentil-Ledoux (2014), Proposition 4.3.1, two-factor upper bound; smooth-test Hilbert realization and domain correspondence recorded in research/explorations/2026-09-03-tensorization-source-alignment.md; normalization from KLS.pdf, Definition 2.1",
      "statement": "Let E and F be real separable Hilbert spaces (complete real inner product spaces with second-countable norm topologies), each equipped with its Borel sigma algebra. For measures mu on E and nu on F, define rho = (mu.prod nu).map (WithLp.toLp 2), a measure on the Hilbert product WithLp 2 (E x F). For all real C and C', Poincare.Holds mu C and Poincare.Holds nu C' imply Poincare.Holds rho (max C C'). Holds includes probability normalization, nonnegativity of its constant, and Var(f) <= C integral ||gradient f||^2 for every globally smooth real-valued L2 test with integrable squared canonical gradient. Moreover, for every pair of Borel probability measures mu and nu, Poincare.constant rho <= max (Poincare.constant mu) (Poincare.constant nu) in ENNReal, including infinite optimal constants. No second-moment, density, positive-dimension, or finite-optimal-constant assumption is imposed.",
      "lean_solution": "solutions/LemPoincareTensorization.lean",
      "checked_by": "lean"
    },
    {
      "id": "lem:poincare-finite-tensorization",
      "kind": "lemma",
      "status": "proved",
      "source": "GitHub Issue #7 (sub-issue of #1), https://github.com/numina-functional-inequalities/kls-lean/issues/7; BGL (2014), Proposition 4.3.1 for the binary upper bound and its finite iteration; coordinate lifting independently supplies reverse bounds and equality; upstream prop:products at 8185e46ffb040e04fea076953e5bcaeb4157d71a; detailed source/API/route audit in research/explorations/2026-09-03-finite-tensorization-design.md",
      "statement": "All constants below refer to the unchanged Poincare.Admissible class of globally smooth real-valued L2 tests with integrable squared canonical Hilbert gradient, with normalization Var_mu(f) <= C integral ||gradient f||^2 dmu. Holds includes probability and nonnegativity of its finite real constant; constant is the ENNReal infimum over finite NNReal constants satisfying Holds. Binary case: let E and F be complete real inner product spaces with second-countable norm topologies and Borel measurable structures, and assume separately that mu on E and nu on F are probability measures. Put rho = prodMeasure mu nu = (mu.prod nu).map (WithLp.toLp 2) on WithLp 2 (E x F). For every real C, Holds rho C implies both Holds mu C and Holds nu C. Each of constant mu and constant nu is at most constant rho, and constant rho = max (constant mu) (constant nu). Probability of rho alone is not the factor normalization hypothesis. Finite case: let iota be any type with a Fintype instance, and let E : iota -> Type be a dependent family of complete real inner product spaces, each with Borel measurable structure and second-countable norm topology. Let mu i be a probability measure on E i for every i. Define piMeasure mu = (Measure.pi mu).map (WithLp.toLp 2) on PiLp 2 E, whose squared Hilbert norm is the finite sum of squared factor norms; the ordinary function-space maximum norm is not used as the Hilbert norm. For every C : iota -> NNReal, if Holds (mu i) (C i : Real) for all i, then Holds (piMeasure mu) ((Finset.univ.sup C : NNReal) : Real). For every real c and i : iota, Holds (piMeasure mu) c implies Holds (mu i) c. For each i, constant (mu i) <= constant (piMeasure mu); moreover constant (piMeasure mu) <= iSup_i constant (mu i), and hence constant (piMeasure mu) = iSup_i constant (mu i), all in ENNReal. No nonempty-index hypothesis is imposed: the empty finite supremum in NNReal and empty indexed supremum in ENNReal are zero, and the empty product satisfies Holds at zero and has optimal constant zero. A Unique index recovers constant (mu default). A probability measure on a subsingleton Hilbert space has fixed and optimal constant zero; arbitrary zero-dimensional factors are allowed, and a family consisting entirely of such factors has optimal constant zero. Any factor constant equal to infinity forces the product constant to equal infinity. Euclidean specializations use E i = EuclideanSpace Real (Fin (d i)) for arbitrary natural-number dimensions d i, with empty, singleton, mixed zero-dimensional and all-zero-dimensional families included. The supporting transport interfaces assert, under the same ambient assumptions, exact admissibility, variance and energy correspondence and invariance of Holds and constant under a real linear isometry equivalence and pushforward of a probability law. For a continuous real linear projection q between these Hilbert spaces, with isometric adjoint and a measure-preserving map between the two probability laws, admissible factor tests lift by composition with q with unchanged variance and energy; L2 and real-energy identities retain their MemLp or Admissible hypotheses. Dependent reindexing and Option splitting preserve the specified product laws and Hilbert norms. No second-moment, density, positive-dimension, finite-optimal-constant or infimum-attainment assumption is imposed. Infinite constants are handled only in ENNReal, never converted to real fixed constants. No equivalence with a Sobolev, closed Dirichlet or spectral-gap test domain and no Gaussian, LSI, Bakry-Emery, Cheeger comparison or full KLS result is claimed.",
      "lean_solution": "solutions/LemPoincareFiniteTensorization.lean",
      "checked_by": "lean"
    },
    {
      "id": "lem:poincare-gaussian-one-dimensional",
      "kind": "lemma",
      "status": "proved",
      "source": "Gaussian covariance family fam:gaussian-covariance, modules/03-tier1-gaussian.tex lines 10-37, at kls-exploration commit cd4a894a0faf40c0180f80b1a31eec1fdb6cb576; Poincare normalization from Definition 2.1 and sharpness from Remark 3.8. Arbitrary means, the zero-variance Dirac case, the smooth finite-energy test domain, and the direct density proof route are explicit local specifications. Exact source correspondence and helper provenance: research/explorations/2026-09-04-gaussian-poincare-design.md.",
      "statement": "For every real mean m and every nonnegative variance v : NNReal, let gamma = ProbabilityTheory.gaussianReal m v, a probability measure on the real line. For the unchanged Poincare.Admissible class of globally smooth real-valued functions f with MemLp f 2 gamma and integrable squared canonical gradient, Poincare.Holds gamma (v : Real): for every such f, Var_gamma(f) <= (v : Real) * integral ||gradient f||^2 dgamma. On the real line the canonical gradient equals the ordinary derivative. Moreover Poincare.constant gamma = (v : ENNReal), where constant is the existing ENNReal infimum over finite NNReal constants satisfying Holds. The parameter v is the variance, not the standard deviation; the energy has no extra factor. No restriction on m or positivity premise on v occurs in either conclusion. At v = 0, gamma is Measure.dirac m and the fixed and optimal constants are zero. The identity test is admissible, has variance v and energy one, and supplies the matching lower bound for every finite valid constant. Positive-variance density helpers are used only under v != 0. No boundedness, compact support, additional derivative-integrability, test-function decay, or infimum-attainment assumption is imposed. This claim concerns the current smooth L2 finite-energy domain; it does not identify a closed Sobolev or spectral-gap domain or assert a multivariate, log-Sobolev, or transport-entropy theorem.",
      "lean_solution": "solutions/LemPoincareGaussianOneDimensional.lean",
      "checked_by": "lean"
    },
    {
      "id": "lem:ambient-intrinsic-poincare-comparison",
      "kind": "lemma",
      "status": "proved",
      "source": "Local Blueprint thm:ambient-intrinsic-relaxation-equality and cor:ambient-intrinsic-constant-equality in formalization/blueprint/src/chapters/30-open-canonical-bridges.tex; local restriction and orthogonal-projection extension argument, with source/API scope recorded in research/decisions/2026-09-06-poincare-comparison-statements.md. Proof acceptance and unchanged-signature audit: research/decisions/2026-09-06-poincare-comparison-proofs.md.",
      "statement": "Let E be any finite-dimensional complete real inner product space with Borel measurable structure and second-countable norm topology, and let mu be any ProbabilityMeasure E. An ambient SmoothGradientTest restricts along Probability.reconstruct mu to an intrinsic SmoothGradientTest whose L2 realization is toIntrinsicL2 mu of the original class and whose finite raw gradient energy is at most the original energy. Conversely, every intrinsic SmoothGradientTest has a globally smooth ambient extension restricting to that test, with the corresponding intrinsic L2 realization and exactly the same raw gradient energy. Consequently smoothGradientRelaxation mu and Energy.Canonical.energy mu are equal as extended-energy functionals on the common original real L2(mu) space. For every C : NNReal their finite-domain Holds predicates are equivalent, and their optimal constants are equal in ENNReal. All conclusions include singular laws, proper affine supports, zero-dimensional spaces, and infinite energy or optimal-constant values. No density, second moment, log-concavity, positive dimension, raw/core agreement, Markov property, or Cheeger identification is assumed. The extension is to be constructed through orthogonal projection, not through the existing merely measurable off-support intrinsicMap.",
      "lean_solution": "solutions/LemAmbientIntrinsicPoincareComparison.lean",
      "checked_by": "lean"
    },
    {
      "id": "lem:legacy-relaxed-poincare-comparison",
      "kind": "lemma",
      "status": "proved",
      "source": "Local Blueprint thm:legacy-relaxed-holds-equivalence and thm:legacy-canonical-constant-comparison in formalization/blueprint/src/chapters/45-shared-analytic-bridges.tex. Historical manuscript Definition 2.1 supplies only the variance/gradient normalization via Poincare.Basic. The abstract pre-energy extension and exact frontend comparison are local specifications; see research/decisions/2026-09-06-poincare-comparison-statements.md. Proof acceptance and unchanged-signature audit: research/decisions/2026-09-06-poincare-comparison-proofs.md.",
      "statement": "For every probability measure mu on an arbitrary measurable space and every finite PreEnergy P realized in real L2(mu), let TestFamily.ofPreEnergy mu P have concrete tests P.Test, variance L2.variance mu of P.toAmbient, and raw energy P.energy. For every C : NNReal, its Holds predicate is equivalent to Poincare.L2Energy.Holds mu P.sequentialRelaxation C on the finite relaxed-energy domain; its extended optimal constant equals Poincare.L2Energy.constant mu P.sequentialRelaxation. This requires neither dense realization nor quadraticity nor raw/relaxed agreement and includes empty test types, C = 0 and infinite optimal constants. In a finite-dimensional complete real inner product space with Borel measurable structure and second-countable norm topology, for every ProbabilityMeasure mu, legacy Holds (mu : Measure E) (C : Real) is equivalent to the raw smoothGradientPreEnergy test-family inequality, then to Poincare.Ambient.Holds mu C. The legacy ENNReal infimum equals Poincare.Ambient.constant mu. Combining this with lem:ambient-intrinsic-poincare-comparison yields equivalence with Poincare.Canonical.Holds mu C and equality with Poincare.Canonical.constant mu. Both smooth test presentations use ordinary C-infinity, square-integrability and integrability of squared canonical gradient, with normalization variance <= C integral norm(gradient)^2 and no extra factor. No density, second moment, log-concavity, positive dimension, finite optimum or attainment is assumed. The locally Lipschitz literature constant and KLS itself are outside these seven comparison theorems.",
      "lean_solution": "solutions/LemLegacyRelaxedPoincareComparison.lean",
      "checked_by": "lean"
    },
    {
      "id": "lem:covariance-test-core-density",
      "kind": "lemma",
      "status": "proved",
      "checked_by": "lean",
      "source": "Local Blueprint Appendix A, formalization/blueprint/src/chapters/60-analytic-comparison-proofs.tex, lem:covariance-test-core-density. Cutoff and compact-support mollification interfaces split the written proof; interval-preserving L1 smoothing is its bounded variant. Statement design and Claude handoff: research/decisions/2026-09-06-weighted-approximation-statements.md. Proof implementation: research/decisions/2026-09-06-weighted-approximation-proofs.md. Acceptance: research/decisions/2026-09-06-weighted-approximation-acceptance.md.",
      "statement": "Let E be a finite-dimensional complete real inner product space with Borel measurable structure and second-countable topology, nu a probability measure on E, and m an additive Haar (Lebesgue reference) measure with nu absolutely continuous with respect to m. For every continuous linear endomorphism B and locally Lipschitz real-valued g with g and B(gradient g) in L2(nu), there exists a sequence of globally C-infinity compactly supported functions g_j such that each g_j and B(gradient g_j) belongs to L2(nu), and the eLpNorm at exponent 2 of both differences g_j-g and B(gradient g_j)-B(gradient g) tends to zero. Separate proved intermediate statements provide compactly supported globally Lipschitz weighted approximation and full-gradient L2 mollification of a compactly supported Lipschitz function preserving its Lipschitz constant. A bounded L1 variant preserves any supplied interval [a,b] and global Lipschitz constant, with source/approximant value and gradient membership in L1(nu), and convergence in both L1 differences; compact support is not required for that variant. The Haar normalization is arbitrary. Zero dimension, zero B and singular B are included. No log-concavity, positive density bound, second moment, full-gradient L2 assumption on the original locally Lipschitz g, or comparison of translated density values is imposed. All four declarations are proved and packaged by Solutions.LemCovarianceTestCoreDensity.certificate. This does not establish local-slope/gradient identification, a Poincare constant comparison or KLS.",
      "lean_solution": "solutions/LemCovarianceTestCoreDensity.lean"
    },
    {
      "id": "thm:smooth-lipschitz-constant-equivalence",
      "kind": "lemma",
      "status": "proved",
      "checked_by": "lean",
      "source": "Local Blueprint thm:smooth-lipschitz-constant-equivalence in formalization/blueprint/src/chapters/45-shared-analytic-bridges.tex. Pointwise slope and gradient correspondence makes the proof's energy identification explicit. The final selected-constant corollary is conditional on intrinsic absolute continuity, not the unrestricted log-concave theorem. Statement design and Claude handoff: research/decisions/2026-09-06-smooth-literature-statements.md. Proof implementation and local acceptance: research/decisions/2026-09-06-smooth-literature-proofs.md.",
      "statement": "Eight proved theorem declarations. In a complete real inner product space, at every point where a real-valued function is Frechet differentiable, the existing KLS.localSlope equals ENNReal.ofReal of the canonical gradient norm, including the zero space. On a finite-dimensional Borel second-countable such space, let nu be a probability law absolutely continuous with respect to an additive Haar reference measure m. For every locally Lipschitz f the equality holds nu-almost everywhere, and literatureEnergy nu f equals the lintegral of the squared extended gradient norm, including infinite energy. LiteratureAdmissible nu f is equivalent to locally Lipschitz f, MemLp f 2 nu, and MemLp (gradient f) 2 nu. For every C : NNReal, legacy Poincare.Holds nu (C : Real) is equivalent to KLS.LiteratureHolds nu C; their infima over finite nonnegative constants on the same coordinate measure are equal in ENNReal. For an arbitrary ambient probability mu, assuming only intrinsicMeasure mu is absolutely continuous with respect to a Haar measure on (affineSupport mu).direction, the legacy constant of mu equals that of intrinsicMeasure mu, and the latter equals KLS.literatureConstant mu. The selected intrinsic-affine smooth-gradient relaxation constant consequently equals KLS.literatureConstant mu under this same explicit hypothesis. Ambient singularity, zero-dimensional support, zero finite constants and infinite optimal constants are included. No positive density bound, log-concavity, second moment, infimum attainment, Cheeger identification or raw/core agreement is assumed. This does not prove intrinsic absolute continuity for log-concave laws or KLS. The a.e. slope and extended-energy declarations omit the redundant second-countable instance; all original mathematical conclusions remain covered.",
      "lean_solution": "solutions/ThmSmoothLipschitzConstantEquivalence.lean"
    },
    {
      "id": "lem:logconcave-intrinsic-absolute-continuity",
      "kind": "lemma",
      "status": "proved",
      "checked_by": "lean",
      "source": "Absolute-continuity portion of Borell (1974), Convex measures on locally convex spaces, Theorem 1.1; direct compact-set proof by local ball averages, separation, Tonelli and Besicovitch covering in research/decisions/2026-09-06-general-logconcave-comparison.md.",
      "statement": "Let E be a finite-dimensional complete real inner product space with its Borel sigma algebra and second-countable norm topology. For every probability measure mu on E satisfying the existing KLS.LogConcave compact-set inequality, and every additive Haar reference measure m on the direction of Probability.affineSupport mu, Probability.intrinsicMeasure mu is absolutely continuous with respect to m. Ambient singularity and zero-dimensional affine support are included. No density, full-dimensional ambient support, second moment, or positive-dimensional hypothesis is assumed. This certifies only the absolute-continuity part of the broader Borell representation node, not its density representative, local positivity or moment conclusions.",
      "lean_solution": "solutions/LemLogConcaveIntrinsicAbsoluteContinuity.lean"
    },
    {
      "id": "thm:selected-literature-constant-equivalence",
      "kind": "lemma",
      "status": "proved",
      "checked_by": "lean",
      "source": "Blueprint thm:selected-literature-constant-equivalence; composition of the proved intrinsic absolute-continuity, smooth/literature and legacy/relaxed comparisons; research/decisions/2026-09-06-general-logconcave-comparison.md.",
      "statement": "For every probability law mu on a finite-dimensional complete real inner product space with its Borel sigma algebra and second-countable norm topology, KLS.LogConcave mu implies Poincare.Canonical.constant mu = KLS.literatureConstant mu in ENNReal. Absolute continuity of the intrinsic law is proved from compact-set log-concavity, not added as a hypothesis. Singular ambient laws, zero-dimensional affine support, zero and infinite optimal constants are included. No Cheeger-energy identification, raw/core agreement, finite-moment hypothesis or KLS bound is asserted.",
      "lean_solution": "solutions/ThmSelectedLiteratureConstantEquivalence.lean"
    }
