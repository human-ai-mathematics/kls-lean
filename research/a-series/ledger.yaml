      "statement": "Let E be a finite-dimensional complete real inner product space with its Borel sigma algebra and second-countable norm topology and mu a Borel probability law on E. Energy.LocalSlope.relaxation nu is the sequential lower-semicontinuous L2(nu) relaxation of the squared local-slope energy over the literature test class Energy.LocalSlope.Admissible (locally Lipschitz, square integrable, finite slope energy), and Energy.Cheeger.energy nu is one half of it: this is the Blueprint's local-slope convention, chosen by the definition Energy.Cheeger.energy := Cheeger.ofLocalSlope and nowhere else. The asymptotic-Lipschitz relaxation Energy.AsymptoticLipschitz.relaxation and the corresponding Cheeger energy Energy.Cheeger.ofAsymptoticLipschitz are defined separately. Their equality is proved by Energy.LocalSlope.relaxation_eq_asymptoticLipschitz and Energy.Cheeger.energy_eq_ofAsymptoticLipschitz and recorded in the separate unconditional certificate thm:smooth-gradient-relaxation-two-cheeger. Energy.Cheeger.Intrinsic.energy mu computes Cheeger.energy for the intrinsic law Probability.intrinsicMeasure mu on the direction space of the affine support and pulls it back to ambient L2(mu) along Energy.Euclidean.toIntrinsicL2, exactly as Energy.SmoothGradient.Intrinsic.energy does for the selected canonical energy of def:selected-canonical-frontend. The single certificate Solutions.CorAbsolutelyContinuousRelaxationTwoCheeger.certificate packages, for every additive Haar measure m on the direction space with Probability.intrinsicMeasure mu absolutely continuous with respect to m: (1) Energy.SmoothGradient.relaxation (intrinsicMeasure mu) = Energy.LocalSlope.relaxation (intrinsicMeasure mu); (2) for every f in L2(mu), Energy.SmoothGradient.Intrinsic.energy mu f = 2 * Energy.Cheeger.Intrinsic.energy mu f, that is the Blueprint's E^can_mu = 2 Ch_mu on ambient L2(mu) with the value infinity allowed on both sides. Every compact-set log-concave law satisfies the hypothesis through the proved node lem:logconcave-intrinsic-absolute-continuity (KLS.LogConcave.intrinsicSmooth_energy_eq_two_mul_cheeger). A one-point affine support is included, both sides being zero. This certificate retains its absolute-continuity premise; the separate certificate Solutions.ThmSmoothGradientRelaxationTwoCheeger.certificate covers every Borel probability law, and its conventions_agree theorem records equality of the two Cheeger conventions. No Poincare inequality, no finiteness of any constant, no Cheeger-Buser comparison, no agreement of raw slope energy with the relaxed energy on an individual test, and no relation to the isoperimetric number of def:isoperimetric-cheeger-scale is claimed.",
